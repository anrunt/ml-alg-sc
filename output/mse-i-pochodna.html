<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MSE i nachylenie stycznej</title>
<style>
body { margin: 0; color: var(--foreground); font-family: var(--font-sans); }
#mse-lab { --viz-series-1: var(--chart-1); --viz-series-2: var(--chart-2); }
#mse-lab * { box-sizing: border-box; }
#mse-lab .controls { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
#mse-lab label { display: block; }
#mse-lab input { display: block; width: 100%; margin: 12px 0; accent-color: var(--primary); min-height: 28px; }
#mse-lab .values { display: flex; flex-wrap: wrap; gap: 12px 28px; margin: 12px 0; }
#mse-lab output { font-variant-numeric: tabular-nums; font-weight: 500; }
#mse-lab .legend { display: flex; gap: 12px 24px; flex-wrap: wrap; margin: 12px 0 0; }
#mse-lab .legend span { display: inline-flex; align-items: center; gap: 8px; }
#mse-lab .swatch { display: inline-block; width: 24px; height: 0; border-top: 3px solid var(--viz-series-1); }
#mse-lab .swatch.tangent { border-color: var(--viz-series-2); border-top-style: dashed; }
#mse-lab svg { display: block; width: 100%; overflow: visible; }
#mse-lab svg text { fill: var(--foreground); font-size: 12px; }
#mse-lab .chart-title { margin: 18px 0 4px; font-weight: 500; }
#mse-lab .foot { margin-top: 8px; color: var(--muted-foreground); }
@media (max-width: 460px) { #mse-lab .controls { grid-template-columns: 1fr; gap: 0; } }
</style>
</head>
<body>
<main id="mse-lab">
  <div class="controls">
    <label for="parameter-w">Parametr w: <output id="w-value">3</output>
      <input class="form-range" id="parameter-w" type="range" min="-3" max="9" step="0.05" value="3">
    </label>
    <label for="constant-c">Stała C: <output id="c-value">10</output>
      <input class="form-range" id="constant-c" type="range" min="0" max="100" step="1" value="10">
    </label>
  </div>
  <div class="values" aria-live="polite">
    <span>MSE: <output id="loss-value">10</output></span>
    <span>Pochodna (nachylenie): <output id="slope-value">0</output></span>
  </div>
  <div class="chart-title">MSE(w) = (w − 3)² + C</div>
  <div class="legend" aria-label="Legenda">
    <span><i class="swatch" aria-hidden="true"></i>Funkcja MSE</span>
    <span><i class="swatch tangent" aria-hidden="true"></i>Styczna w wybranym punkcie</span>
  </div>
  <svg id="loss-chart" role="img" aria-labelledby="loss-title loss-desc"></svg>
  <div class="chart-title">Pochodna MSE względem w = 2(w − 3)</div>
  <svg id="slope-chart" role="img" aria-labelledby="slope-title slope-desc"></svg>
  <div class="foot">Stałe skale osi · ● wybrany punkt</div>
</main>
<script>
(() => {
  const root = document.getElementById('mse-lab');
  const wInput = root.querySelector('#parameter-w');
  const cInput = root.querySelector('#constant-c');
  const format = value => Number(value.toFixed(4)).toLocaleString('pl-PL', { maximumFractionDigits: 4 });
  const ns = 'http://www.w3.org/2000/svg';
  const state = { w: 3, c: 10 };
  const xMin = -5;
  const xMax = 11;
  const maxLoss = Math.max((xMin - 3) ** 2, (xMax - 3) ** 2) + Number(cInput.max);
  const lossBounds = [-20, Math.ceil(maxLoss / 20) * 20];

  function element(parent, name, attrs, content) {
    const item = document.createElementNS(ns, name);
    for (const [key, value] of Object.entries(attrs)) item.setAttribute(key, value);
    if (content !== undefined) item.textContent = content;
    parent.appendChild(item);
    return item;
  }

  function plot(svg, kind) {
    const isLoss = kind === 'loss';
    const width = Math.max(280, root.getBoundingClientRect().width);
    const height = isLoss ? 350 : 205;
    const left = 64, right = width - 16, top = 30, bottom = height - 44;
    const yMin = isLoss ? lossBounds[0] : 2 * (xMin - 3) - 2;
    const yMax = isLoss ? lossBounds[1] : 2 * (xMax - 3) + 2;
    const x = value => left + 6 + (value - xMin) / (xMax - xMin) * (right - left - 12);
    const y = value => bottom - 6 - (value - yMin) / (yMax - yMin) * (bottom - top - 12);
    const loss = (state.w - 3) ** 2 + state.c;
    const slope = 2 * (state.w - 3);
    svg.replaceChildren();
    svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
    svg.style.height = `${height}px`;
    element(svg, 'title', { id: `${kind}-title` }, isLoss ? 'Funkcja MSE i styczna' : 'Pochodna MSE');
    element(svg, 'desc', { id: `${kind}-desc` }, `w = ${format(state.w)}, C = ${format(state.c)}. MSE = ${format(loss)}, pochodna = ${format(slope)}.`);
    const defs = element(svg, 'defs', {});
    const clip = element(defs, 'clipPath', { id: `${kind}-clip` });
    element(clip, 'rect', { x: left, y: top, width: right - left, height: bottom - top });
    element(svg, 'rect', { 'data-chart-frame': '', x: left, y: top, width: right - left, height: bottom - top, fill: 'none', stroke: 'var(--border)' });
    const yTicks = isLoss ? [0, 40, 80, 120, 160] : [-12, 0, 12];
    for (const tick of yTicks) {
      element(svg, 'line', { x1: left, x2: right, y1: y(tick), y2: y(tick), stroke: tick === 0 ? 'var(--muted-foreground)' : 'var(--border)', 'stroke-width': 1 });
      element(svg, 'text', { x: left - 10, y: y(tick) + 4, 'text-anchor': 'end' }, format(tick));
    }
    for (const tick of [-3, 0, 3, 9]) {
      element(svg, 'line', { x1: x(tick), x2: x(tick), y1: top, y2: bottom, stroke: 'var(--border)' });
      element(svg, 'text', { x: x(tick), y: bottom + 20, 'text-anchor': 'middle' }, format(tick));
    }
    element(svg, 'text', { class: 'axis-title', 'data-axis': 'x', x: right, y: height - 3, 'text-anchor': 'end' }, 'w');
    element(svg, 'text', { class: 'axis-title', 'data-axis': 'y', x: left, y: 17 }, isLoss ? 'MSE' : 'dMSE / dw');
    const marks = element(svg, 'g', { 'clip-path': `url(#${kind}-clip)` });
    const points = [];
    for (let i = 0; i <= 200; i++) {
      const w = xMin + (xMax - xMin) * i / 200;
      points.push(`${i ? 'L' : 'M'}${x(w)},${y(isLoss ? (w - 3) ** 2 + state.c : 2 * (w - 3))}`);
    }
    element(marks, 'path', { d: points.join(' '), fill: 'none', stroke: isLoss ? 'var(--viz-series-1)' : 'var(--viz-series-2)', 'stroke-width': 2.5 });
    if (isLoss) {
      element(marks, 'line', {
        x1: x(xMin), x2: x(xMax),
        y1: y(loss + slope * (xMin - state.w)), y2: y(loss + slope * (xMax - state.w)),
        stroke: 'var(--viz-series-2)', 'stroke-width': 2, 'stroke-dasharray': '7 5'
      });
    }
    const pointY = y(isLoss ? loss : slope);
    element(marks, 'line', { x1: x(state.w), x2: x(state.w), y1: bottom, y2: pointY, stroke: 'var(--muted-foreground)', 'stroke-dasharray': '3 4' });
    element(marks, 'circle', { cx: x(state.w), cy: pointY, r: 5.5, fill: isLoss ? 'var(--viz-series-1)' : 'var(--viz-series-2)', stroke: 'var(--background)', 'stroke-width': 2 });
    const labels = [...svg.querySelectorAll('text')];
    for (let i = 0; i < labels.length; i++) {
      const a = labels[i].getBBox();
      for (let j = i + 1; j < labels.length; j++) {
        const b = labels[j].getBBox();
        if (a.x < b.x + b.width + 4 && a.x + a.width + 4 > b.x && a.y < b.y + b.height + 4 && a.y + a.height + 4 > b.y && !labels[j].classList.contains('axis-title')) labels[j].setAttribute('visibility', 'hidden');
      }
    }
  }

  function draw() {
    wInput.value = state.w;
    cInput.value = state.c;
    root.querySelector('#w-value').textContent = format(state.w);
    root.querySelector('#c-value').textContent = format(state.c);
    root.querySelector('#loss-value').textContent = format((state.w - 3) ** 2 + state.c);
    root.querySelector('#slope-value').textContent = format(2 * (state.w - 3));
    plot(root.querySelector('#loss-chart'), 'loss');
    plot(root.querySelector('#slope-chart'), 'slope');
  }

  function restore(saved) {
    const values = saved?.modelContent;
    if (!values) return;
    if (Number.isFinite(values.w)) state.w = Math.max(-3, Math.min(9, values.w));
    if (Number.isFinite(values.c)) state.c = Math.max(0, Math.min(100, values.c));
  }
  function update() {
    state.w = Number(wInput.value);
    state.c = Number(cInput.value);
    draw();
    if (window.openai?.setWidgetState) window.openai.setWidgetState({ modelContent: { ...state }, privateContent: null }).catch(() => {});
  }
  wInput.addEventListener('input', update);
  cInput.addEventListener('input', update);
  restore(window.openai?.widgetState);
  window.addEventListener('openai:set_globals', event => {
    if (event.detail?.globals?.widgetState) { restore(event.detail.globals.widgetState); draw(); }
  });
  new ResizeObserver(draw).observe(root);
  draw();
})();
</script>
</body>
</html>
